<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Opening Coach</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Opening Coach">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a1d17">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=202611141455">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Opening Coach</h1>
      <p>Play chess. The coach names every opening move, rates it, and gives you a plan.</p>
    </div>
    <div class="setup">
      <div class="field">
        <label for="opt-color">Play as</label>
        <select id="opt-color">
          <option value="w">White</option>
          <option value="b">Black</option>
          <option value="r">Random</option>
        </select>
      </div>
      <div class="field">
        <label for="opt-opp">Opponent</label>
        <select id="opt-opp">
          <option value="supereasy">Computer: super easy</option>
          <option value="easy">Computer: easy</option>
          <option value="medium" selected>Computer: medium</option>
          <option value="mediumhard">Computer: medium-hard</option>
          <option value="hard">Computer: hard</option>
          <option value="friend">A friend (same screen)</option>
        </select>
      </div>
      <button class="btn primary" id="btn-new" type="button">New game</button>
      <button class="btn sync-btn off" id="btn-sync" type="button" hidden>Sync: off</button>
    </div>
  </header>
  <div class="reminder limit" id="limit-alert" role="alert" hidden></div>
  <div class="reminder" id="backup-reminder" role="status" hidden></div>

  <main class="grid">
    <section class="board-col" aria-label="Chess board">
      <div class="opening-banner" id="banner"></div>
      <div class="player" id="player-top"></div>
      <div class="board-frame">
        <div class="board" id="board" role="grid" aria-label="Board"></div>
        <div class="lost-toast" id="lost-toast" role="alert" hidden>
          <span class="lost-icon" id="lost-icon" aria-hidden="true"></span>
          <span id="lost-text"></span>
          <button type="button" class="lost-x" id="lost-x" aria-label="Close">×</button>
        </div>
        <div class="start-overlay" id="start-overlay" hidden>
          <div class="start-card">
            <h2 id="start-title">Ready to play?</h2>
            <p id="start-info"></p>
            <button class="btn primary big" id="btn-start" type="button">Start game</button>
          </div>
        </div>
      </div>
      <div class="player" id="player-bottom"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="controls">
        <button class="btn" id="btn-hint" type="button">Hint</button>
        <button class="btn" id="btn-undo" type="button">Take back</button>
        <button class="btn" id="btn-reset" type="button">Reset board</button>
        <button class="btn" id="btn-flip" type="button">Flip board</button>
        <button class="btn" id="btn-resign" type="button">Resign</button>
        <button class="btn" id="btn-sound" type="button" aria-pressed="true">Sound: on</button>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-coach" aria-selected="true" type="button">Coach</button>
        <button class="tab" role="tab" id="tab-openings" aria-selected="false" type="button">Openings</button>
        <button class="tab" role="tab" id="tab-style" aria-selected="false" type="button">My style</button>
      </div>
      <div class="tabpane" id="pane-coach"></div>
      <div class="tabpane" id="pane-openings" hidden></div>
      <div class="tabpane" id="pane-style" hidden></div>
    </aside>
  </main>
</div>
<script src="lib/chess.js?v=202611141455"></script>
<script src="js/openings.js?v=202611141455"></script>
<script src="js/engine.js?v=202611141455"></script>
<script src="js/coach.js?v=202611141455"></script>
<script src="js/theme.js?v=202611141455"></script>
<script src="js/app.js?v=202611141455"></script>
</body>
</html>
